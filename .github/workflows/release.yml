name: Release

# Builds VaultKey (desktop/, Tauri 2) for macOS, Windows and Linux on every v* tag, and
# attaches the installers to a draft GitHub release for that tag: check it, then publish.
# No separate build artifacts are uploaded, so nothing piles up in Actions storage.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# It can also be started by hand (Actions → Release → Run workflow), naming the tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and release, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One app for Apple Silicon and Intel Macs.
          - name: macOS
            runner: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # 22.04: its older glibc lets the .deb and AppImage run on more distributions.
          - name: Linux
            runner: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: Windows
            runner: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Linux build packages
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: VaultKey ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Download the installer for your system below:
            - macOS: the `.dmg` (Apple Silicon and Intel)
            - Windows: the `.msi` or `-setup.exe`
            - Linux: the `.deb`, `.rpm` or `.AppImage`

            How to install, use and update it safely: see desktop/README.md.
          releaseDraft: true
          prerelease: false
