<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64">
  <!--
    The extension's icon (48 and 128 px): VaultKey's mark from src-tauri/icons/app-icon.svg,
    on a full-size tile (a toolbar icon has no room for the macOS grid's margin). Rendered
    to public/icon/*.png by scripts/icons.sh. icon-small.svg is the 16/32 px cut.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6672e4" />
      <stop offset="1" stop-color="#4350c6" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dfe3ff" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#tile)" />
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#glow)" />
  <g transform="translate(32 33) scale(0.94) translate(-32 -32)">
    <circle cx="32" cy="32" r="19.8" fill="#ffffff" fill-opacity="0.12" />
    <circle cx="32" cy="32" r="22" fill="none" stroke="url(#metal)" stroke-width="4.4" />
    <path d="M32 4.7l3.2 4.4h-6.4z" fill="#ffffff" />
    <g stroke="#ffffff" stroke-linecap="round" stroke-width="1.9">
      <line x1="32" y1="19" x2="32" y2="15.1" />
      <line x1="45" y1="32" x2="48.9" y2="32" />
      <line x1="32" y1="45" x2="32" y2="48.9" />
      <line x1="19" y1="32" x2="15.1" y2="32" />
    </g>
    <path fill="url(#metal)" fill-rule="evenodd"
      d="M32 22.4a9.6 9.6 0 1 1 0 19.2a9.6 9.6 0 1 1 0-19.2ZM30.3 34.2A3.4 3.4 0 1 1 33.7 34.2L34.5 38.6C34.6 39.3 34.2 39.8 33.5 39.8H30.5C29.8 39.8 29.4 39.3 29.5 38.6Z" />
  </g>
</svg>
