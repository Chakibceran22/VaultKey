<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    VaultKey app icon, the source for every generated size:
      cd desktop && pnpm tauri icon src-tauri/icons/app-icon.svg
    A combination-lock dial with a keyhole hub, on the DevNotes indigo tile (same
    gradient, glow, lit rim and drop shadow, on the macOS icon grid: an 824 px
    body inset 100 px). The dial is drawn on a 64-unit grid scaled x9.4 around
    the centre; src/components/brand/VaultMark.tsx uses the same geometry.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6672e4" />
      <stop offset="1" stop-color="#4350c6" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dfe3ff" />
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b0e2a" flood-opacity="0.32" />
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.3" flood-color="#1c2266" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)" />
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)" />
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3" />

  <g transform="translate(512 512) scale(9.4) translate(-32 -32)">
    <!-- dial face -->
    <circle cx="32" cy="32" r="19.8" fill="url(#face)" />
    <g filter="url(#lift)">
      <!-- outer ring and its pointer -->
      <circle cx="32" cy="32" r="22" fill="none" stroke="url(#metal)" stroke-width="4.4" />
      <path d="M32 4.7l3.2 4.4h-6.4z" fill="#ffffff" />
      <!-- graduations -->
      <g stroke="#ffffff" stroke-linecap="round">
      <line x1="32.00" y1="19.00" x2="32.00" y2="15.10" stroke-width="1.8" stroke-opacity="0.95" />
      <line x1="35.78" y1="17.90" x2="36.37" y2="15.68" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="39.30" y1="19.36" x2="40.45" y2="17.36" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="42.32" y1="21.68" x2="43.95" y2="20.05" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="44.64" y1="24.70" x2="46.64" y2="23.55" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="46.10" y1="28.22" x2="48.32" y2="27.63" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="45.00" y1="32.00" x2="48.90" y2="32.00" stroke-width="1.8" stroke-opacity="0.95" />
      <line x1="46.10" y1="35.78" x2="48.32" y2="36.37" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="44.64" y1="39.30" x2="46.64" y2="40.45" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="42.32" y1="42.32" x2="43.95" y2="43.95" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="39.30" y1="44.64" x2="40.45" y2="46.64" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="35.78" y1="46.10" x2="36.37" y2="48.32" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="32.00" y1="45.00" x2="32.00" y2="48.90" stroke-width="1.8" stroke-opacity="0.95" />
      <line x1="28.22" y1="46.10" x2="27.63" y2="48.32" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="24.70" y1="44.64" x2="23.55" y2="46.64" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="21.68" y1="42.32" x2="20.05" y2="43.95" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="19.36" y1="39.30" x2="17.36" y2="40.45" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="17.90" y1="35.78" x2="15.68" y2="36.37" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="19.00" y1="32.00" x2="15.10" y2="32.00" stroke-width="1.8" stroke-opacity="0.95" />
      <line x1="17.90" y1="28.22" x2="15.68" y2="27.63" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="19.36" y1="24.70" x2="17.36" y2="23.55" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="21.68" y1="21.68" x2="20.05" y2="20.05" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="24.70" y1="19.36" x2="23.55" y2="17.36" stroke-width="1.1" stroke-opacity="0.5" />
      <line x1="28.22" y1="17.90" x2="27.63" y2="15.68" stroke-width="1.1" stroke-opacity="0.5" />
      </g>
      <!-- hub, with the keyhole cut out so the tile shows through -->
      <path
        fill="url(#metal)"
        fill-rule="evenodd"
        d="M32 22.4a9.6 9.6 0 1 1 0 19.2a9.6 9.6 0 1 1 0-19.2Z
           M30.3 34.2A3.4 3.4 0 1 1 33.7 34.2L34.5 38.6C34.6 39.3 34.2 39.8 33.5 39.8H30.5C29.8 39.8 29.4 39.3 29.5 38.6Z"
      />
    </g>
  </g>
</svg>
