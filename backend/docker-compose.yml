services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped 
    container_name: password_pg_db
    environment:
      POSTGRES_DB: password_db
      POSTGRES_USER: chakib
      POSTGRES_PASSWORD: ChakibLovesMimane123@.
    ports:
      - "5433:5432"
    volumes:
      - pgpasswordata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chakib -d password_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: vaultkey-backend:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://chakib:ChakibLovesMimane123%40.@postgres:5432/password_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PORT: 3000
      LOKI_URL: http://loki:3100
    depends_on:
      postgres:
        condition: service_healthy


  loki:
      image: grafana/loki:2.9.0
      container_name: loki
      ports:
        - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - loki
volumes:
  pgpasswordata:
