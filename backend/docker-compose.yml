services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: password_pg_db
    environment:
      POSTGRES_DB: password_db
      POSTGRES_USER: chakib
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgpasswordata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chakib -d password_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: vaultkey-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-13000}:3000"
    environment:
      DATABASE_URL: postgresql://chakib:${POSTGRES_PASSWORD_URLENCODED}@postgres:5432/password_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PORT: 3000
      LOKI_URL: http://loki:3100
    depends_on:
      postgres:
        condition: service_healthy

  # loki:
  #   image: grafana/loki:2.9.0
  #   container_name: loki
  #   restart: unless-stopped
  #   # no ports — only backend and grafana talk to it, both inside the network

  # grafana:
